# Netlify: plain static site, no build step. Publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Images and fonts: browsers reuse them for a day, then quietly re-check.
# (File names aren't versioned, so a replaced photo shows up within a day.)
# HTML, CSS and JS keep Netlify's default: re-checked on every visit, so a
# new deploy is always picked up together.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
