<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Try the Look — Runway</title>
  <meta name="description" content="Five looks, styled head to toe. Explore the runway, isolate a look, and tap a pin to see the piece.">
  <link rel="preload" as="image" href="assets/images/runway/look-1-640.webp" fetchpriority="high">
  <link rel="stylesheet" href="runway.css">
  <link rel="stylesheet" href="intro.css">
  <script>document.documentElement.classList.add('js','intro-open');</script>
</head>
<body>

  <!-- Welcome intro -->
  <div class="intro" aria-label="Welcome to Lord Knows">
    <div class="intro-stage">
      <div class="intro-models" aria-hidden="true">
        <img src="assets/images/runway/look-2-640.webp" alt="">
        <img src="assets/images/runway/look-4-640.webp" alt="">
        <img src="assets/images/runway/look-1-640.webp" alt="">
        <img src="assets/images/runway/look-3-640.webp" alt="">
        <img src="assets/images/runway/look-5-640.webp" alt="">
      </div>
      <div class="intro-scrim"></div>
      <div class="intro-center">
        <p class="intro-word" aria-label="Lord Knows"></p>
        <div class="intro-welcome">
          <p class="intro-kicker">Welcome to the runway</p>
          <p>Five looks, styled head to toe.</p>
        </div>
      </div>
    </div>
    <span class="intro-skip" aria-hidden="true">Tap anywhere to skip</span>
  </div>

  <header class="site-header shopify-section-group-header-group">
    <a href="./" class="brand" aria-label="Runway home"><span class="brand-mark">Lord Knows</span></a>
    <nav aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="./" aria-current="page">Runway</a>
    </nav>
    <button type="button" id="open-bag" aria-label="Open styling bag">
      <svg width="22" height="24" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 8h16l1 16H3L4 8zM8 8V6a4 4 0 0 1 8 0v2"/></svg>
      <span data-cart-count>0</span>
    </button>
  </header>

  <main>
    <runway-section
      id="Runway-lord-knows"
      class="rw rw--add-icon rw--popup rw--list has-dividers has-border"
      data-feel="balanced"
      data-blur="true"
      data-mblur="true"
      data-style="ring"
      data-mstyle="classic"
      data-fit="true"
      data-height-mode="original"
      data-height-vh="100"
      data-mheight-mode="custom"
      data-mheight-vh="109"
      data-reflect="false"
      data-autoplay="true"
      data-speed="5000"
      data-after-add="stay"
      data-bundle-code=""
      data-msg-choose="Pick a size for: [items]"
      data-msg-error="Couldn’t add to bag. Please try again."
      data-msg-soldout="Sold out"></runway-section>
  </main>

  <dialog id="bag-dialog" aria-labelledby="bag-title">
    <div class="bag-heading">
      <h2 id="bag-title">Your styling bag</h2>
      <button type="button" id="close-bag" aria-label="Close styling bag">×</button>
    </div>
    <p class="bag-note">A local outfit shortlist. No payment or order is collected here. Contact Lord Knows at hello@lordknows.com to order.</p>
    <div id="bag-items"></div>
    <p id="bag-total"></p>
    <button type="button" id="export-bag" disabled>Download outfit shortlist</button>
  </dialog>

  <div id="bag-status" role="status" aria-live="polite"></div>

  <script src="runway.js" defer></script>
  <script src="intro.js" defer></script>
</body>
</html>
